services:
  clientes-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-clientes_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - clientes_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-clientes.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  clientes-api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      CLIENTES_PORT: 3001
      DB_HOST: clientes-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-clientes_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${CLIENTES_PORT:-3001}:3001"
    depends_on:
      clientes-db:
        condition: service_healthy

volumes:
  clientes_mysql_data:
